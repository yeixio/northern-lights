name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today. Who would use it (visitors, members, admins)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Any idea of how it could look or behave. Sketches and screenshots of other apps are welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Want to build it?
      options:
        - label: I'd like to work on this myself
