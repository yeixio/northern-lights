name: App

# Builds the Northern Lights app (hub/, src/hub/) as a small nginx image
# (hub/Dockerfile). Pull requests build and check it; pushes to main publish it
# to ghcr.io/yeixio/northern-lights-app as :main and :sha-<commit>, which the
# yeix.io cluster serves at app.yeix.io (docs/app.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-app

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          load: true
          tags: northern-lights-app:test
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Start the container and check it serves the app
        run: |
          docker run -d --name app -p 8080:8080 northern-lights-app:test
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/messages | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/sw.js > /dev/null
          docker logs app

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every stage but the last runs on the build machine, and the last only
      # copies files, so the arm64 image needs no emulation.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
