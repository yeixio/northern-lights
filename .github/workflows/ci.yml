name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northern_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Type-check the demo scripts
        run: npx tsc -p scripts/tsconfig.json
      - name: Seed the demo data
        run: npm run demo:seed
        env:
          DATA_DIR: ${{ runner.temp }}/demo-data
      - name: Test (SQLite)
        run: npm test
      - name: Test (Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/northern_test
