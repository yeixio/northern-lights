{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "northern-lights.fullname" . }}
  labels:
    {{- include "northern-lights.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
