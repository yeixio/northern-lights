apiVersion: apps/v1
kind: Deployment
metadata:
  name: northern-lights
spec:
  # SQLite and local uploads allow one running copy. Recreate stops the old pod
  # before starting the new one so they never share the volume.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's "node" user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: northern-lights
          image: ghcr.io/yeixio/northern-lights
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: northern-lights-config
            - secretRef:
                name: northern-lights-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/public/site
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/site
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: northern-lights-data
        - name: tmp
          emptyDir: {}
