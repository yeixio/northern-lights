# Northern Lights
#
#   docker compose up -d
#
# Then open http://localhost:3000 and create your admin account.
# Update later with:  docker compose pull && docker compose up -d
#
# This uses the published image. If it can't be pulled, Compose builds it from
# this folder instead; `docker compose up -d --build` always builds locally.
#
# HTTPS on your own domain: see docker-compose.caddy.yml.
# Postgres instead of SQLite: uncomment the `db` service and DATABASE_URL below.
services:
  app:
    image: ghcr.io/yeixio/northern-lights:${NL_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - northern-data:/data
    environment:
      PORT: "3000"
      # APP_URL: https://family.example.com
      # SMTP_URL: smtps://user:password@smtp.example.com:465
      # MAIL_FROM: Northern Lights <no-reply@example.com>
      # DATABASE_URL: postgres://northern:northern@db:5432/northern_lights
    # depends_on: [db]

  # db:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: northern
  #     POSTGRES_PASSWORD: northern
  #     POSTGRES_DB: northern_lights
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  northern-data:
  # postgres-data:
