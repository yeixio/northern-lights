server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # File names under /assets/ change with their content, so they never go stale.
    location /assets/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else, including sw.js and index.html, is checked on every
    # load so a new version reaches people right away. Unknown paths are the
    # app's own pages (/messages, /add, ...).
    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
