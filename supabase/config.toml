# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "northern-lights"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
# Local email viewer: invite emails land here during development.
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/welcome", "http://localhost:5173/reset-password"]
# Invite-only: nobody can create an account on their own.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.invite-user]
verify_jwt = true
